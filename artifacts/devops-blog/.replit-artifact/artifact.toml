kind = "web"
previewPath = "/"
title = "DevOps & SRE Blog"
version = "1.0.0"
id = "artifacts/devops-blog"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18564

[services.development]
run = "pnpm --filter @workspace/devops-blog run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/devops-blog", "run", "build" ]
publicDir = "artifacts/devops-blog/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18564"
BASE_PATH = "/"
